<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta name="application-name" content="VPSNAT">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VPSNAT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>VPSNAT Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--card2:#f1f5f9;--line:#e2e8f0;--tx:#0f172a;--mut:#64748b;--ac:#2563eb;--ac2:#1d4ed8;--acx:#2563eb;--acs:#eff6ff;--ok:#16a34a;--okx:#15803d;--oks:#f0fdf4;--warn:#d97706;--warnx:#b45309;--warns:#fffbeb;--bad:#dc2626;--badx:#b91c1c;--bads:#fef2f2;--dark:#0f172a;--nav:rgba(255,255,255,.88);--th:#f8fafc;--dgl:#fecaca;--dgb:#fffafa;--ph:#94a3b8;--fld:#fff;--ring:rgba(37,99,235,.18);--r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--card2:#18233c;--line:#25324d;--tx:#e6ebf5;--mut:#97a6c0;--acx:#7db3ff;--acs:#15244a;--okx:#4ade80;--oks:#0f2a1c;--warnx:#fbbf24;--warns:#2e2410;--badx:#f87171;--bads:#2f1517;--dark:#060b16;--nav:rgba(11,18,32,.86);--th:#0f1830;--dgl:#5b2428;--dgb:#1a1214;--ph:#64748b;--fld:#0d1527;--ring:rgba(125,179,255,.28);--sh:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--acx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.netbar{background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:600;padding:6px 12px}
.nav{position:sticky;top:0;z-index:10;background:var(--nav);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1100px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.2px;min-width:0}
.logo>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo .mk img{width:100%;height:100%;object-fit:cover}
.logo small{color:var(--mut);font-weight:500;font-size:12px}
#app{max-width:1100px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h1,h2,h3{margin:0 0 10px;letter-spacing:-.2px}h1{font-size:22px;line-height:1.25}h2{font-size:16px}h3{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;word-break:break-all}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:14px}.grid>.card{margin-bottom:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center}.kv span:nth-child(odd){color:var(--mut)}.kv span{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--fld);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
input::placeholder{color:var(--ph)}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
label{display:block;color:var(--mut);font-size:12px;font-weight:500;margin:10px 0 4px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:10px;padding:9px 15px;min-height:38px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,transform .05s,border-color .15s}
button:hover{background:var(--ac2)}button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:not-allowed}
button.sec{background:var(--card);border-color:var(--line);color:var(--tx)}button.sec:hover{background:var(--card2)}
button.ok{background:var(--ok);border-color:var(--ok)}button.ok:hover{background:#15803d}
button.bad{background:var(--bad);border-color:var(--bad)}button.bad:hover{background:#b91c1c}
button.warn{background:var(--warn);border-color:var(--warn)}button.warn:hover{background:#b45309}
button.sm{padding:5px 10px;min-height:30px;font-size:12px;border-radius:8px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--card2);padding:5px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{background:transparent;border-color:transparent;color:var(--mut);padding:7px 14px;min-height:34px}
.tabs button:hover{background:var(--card);color:var(--tx)}
.tabs button.on{background:var(--card);color:var(--acx);border-color:var(--line);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.b-RUNNING{background:var(--oks);color:var(--okx)}.b-STOPPED,.b-MISSING{background:var(--bads);color:var(--badx)}.b-SUSPEND{background:var(--warns);color:var(--warnx)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}.bar i.md{background:var(--warn)}.bar i.hi{background:var(--bad)}
.m{margin-bottom:12px}.mh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-bottom:5px}.mh span:first-child{color:var(--tx);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px;font-weight:600;background:var(--th)}
td.wrap{white-space:normal;min-width:180px}
tr.click{cursor:pointer}tr.click:hover{background:var(--acs)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
code{background:var(--card2);padding:2px 7px;border-radius:6px;word-break:break-all}
pre{background:var(--dark);color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word;margin:10px 0 0}
.mut{color:var(--mut)}.err{color:var(--badx)}.warnt{color:var(--warnx)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--card2),var(--card),var(--card2));background-size:200% 100%;animation:sh 1.2s ease-in-out infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.login{max-width:430px;margin:5vh auto 0}
.login .hero{text-align:center;margin-bottom:18px}
.login .hero .mk{width:56px;height:56px;border-radius:16px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto 12px;overflow:hidden;box-shadow:0 8px 20px rgba(37,99,235,.3)}
.login .hero .mk img{width:100%;height:100%;object-fit:cover}.login .hero .mk .ic{width:28px;height:28px}
.login .hero p{margin:4px 0 0;color:var(--mut)}
.sheet{position:fixed;inset:0;background:rgba(6,11,22,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);overflow:auto;overscroll-behavior:contain;z-index:20;padding:12px;animation:fade .15s ease-out}
.sheet:focus{outline:0}
.sheet>.in{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px;animation:rise .18s ease-out}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:#fff;border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--ok);border-radius:10px;padding:11px 18px;z-index:50;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow-wrap:anywhere}
.toast.e{border-left-color:var(--bad)}
.danger{border-color:var(--dgl);background:var(--dgb)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.cols2{display:grid;gap:10px;grid-template-columns:1fr 1fr}.cols3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;letter-spacing:-.3px;line-height:1.2}.stat span{color:var(--mut);font-size:12px}.stat small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.stat.ok b{color:var(--okx)}.stat.warn b{color:var(--warnx)}.stat.bad b{color:var(--badx)}
.fbar{display:grid;gap:8px;grid-template-columns:1fr 150px;margin-bottom:12px}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.vc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.vc:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(37,99,235,.14);transform:translateY(-1px)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}.vc .vh b{font-size:15px;word-break:break-all}
.vc .vs{color:var(--mut);font-size:12px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:var(--card2);color:var(--tx);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500}
.vc .vf{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px;margin-top:8px}
.vc .m{margin-bottom:0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty .ic{width:30px;height:30px;display:block;margin:0 auto 8px;opacity:.6}
.pwa-hint{margin-top:10px;font-size:12px;color:var(--mut)}
.doc h3{margin:18px 0 8px}.doc h3:first-child{margin-top:0}
.doc .lead{color:var(--mut);margin:0 0 10px}
.facts{display:grid;gap:8px 12px;grid-template-columns:150px 1fr;margin:0 0 6px}.facts>b{font-weight:600}.facts>span{color:var(--mut);min-width:0;overflow-wrap:anywhere}
details.ep{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
details.ep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px}
details.ep>summary::-webkit-details-marker{display:none}
details.ep>summary:hover{background:var(--card2)}
details.ep[open]>summary{border-bottom:1px solid var(--line);border-bottom-left-radius:0;border-bottom-right-radius:0}
.ep .pth{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.ep .sd{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.ep .bd{padding:12px}.ep .bd p{margin:0 0 8px}
.mth{font:700 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:5px 7px;border-radius:6px;min-width:56px;text-align:center;flex:none}
.m-GET{background:var(--oks);color:var(--okx)}.m-POST{background:var(--acs);color:var(--acx)}.m-DELETE{background:var(--bads);color:var(--badx)}
.ep table{min-width:460px;margin-bottom:8px}.ep th,.ep td{padding:6px 8px;font-size:12.5px}
.ep pre{max-height:240px}
.ep .cp{float:right;margin:0 0 6px 8px}
.apisrch{margin-bottom:10px}
@media(max-width:520px){
  input,select{font-size:16px}
  .fbar{grid-template-columns:1fr}.cols3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:92px 1fr}.facts{grid-template-columns:1fr}
  .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
  .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap;flex:1 1 auto;padding:7px 10px}
  .sheet{padding:0}.sheet>.in{border-radius:0;border:0;min-height:100%}
  .ep .sd{display:none}
}
@media(max-width:380px){.cols2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="net" class="netbar" role="status" hidden>Offline — data tidak diperbarui sampai koneksi kembali.</div>
<div id="nav"></div>
<div id="app"></div>
<script nonce="{{NONCE}}">
'use strict';
const S = {role:null, name:null, tab:'vps', vps:[], sel:null, me:null, timers:[], brand:'VPSNAT', logo:'', pwa:null, offline:false};
const ICONS = {
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  refresh:'<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  play:'<polygon points="5 3 19 12 5 21 5 3"/>',
  rotate:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  stop:'<rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  server:'<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
function mark() { return S.logo ? `<img src="${esc(S.logo)}" alt="">` : ic('server'); }
function setNav(right, tag) {
  $('#nav').innerHTML = `<div class="nav"><div class="in"><div class="logo"><span class="mk">${mark()}</span><span>${esc(S.brand)}${tag ? ` <small>${esc(tag)}</small>` : ''}</span></div><div class="row">${installBtn()}${right || ''}</div></div></div>`;
  syncInstall();
}
const installBtn = () => `<button class="sec sm" data-a="install" data-install hidden>${ic('download')} Pasang aplikasi</button>`;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const fb = b => { b = Number(b)||0; if (b>=1e12) return (b/1e12).toFixed(2)+' TB'; if (b>=1e9) return (b/1e9).toFixed(2)+' GB'; if (b>=1e6) return (b/1e6).toFixed(1)+' MB'; if (b>=1e3) return (b/1e3).toFixed(0)+' KB'; return b+' B'; };
const fdate = e => e ? new Date(e*1000).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : 'Tanpa expired';
const fup = s => { const d=Math.floor(s/86400), h=Math.floor(s%86400/3600); return d+'h '+h+'j'; };
const fmb = m => { m = Number(m)||0; return m >= 1024 ? (m/1024).toFixed(m % 1024 ? 1 : 0) + ' GB' : m + ' MB'; };
const daysLeft = e => e ? Math.ceil((e*1000 - Date.now())/864e5) : null;
const fexp = e => { if (!e) return '∞'; const d = daysLeft(e); return d < 0 ? 'Expired' : d === 0 ? 'Hari ini' : d + ' hari lagi'; };
const IMAGES = ['ubuntu24','ubuntu22','ubuntu20','debian12','debian11','alma9','rocky9','alpine'];
const opts = (list, sel) => list.map(x => `<option value="${esc(x)}"${x===sel?' selected':''}>${esc(x)}</option>`).join('');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' e' : '');
  t.setAttribute('role', bad ? 'alert' : 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

async function api(method, path, body) {
  let r;
  try {
    r = await fetch(path, {method, credentials:'same-origin',
      headers:{'Content-Type':'application/json','X-Requested-With':'vpsnat'},
      body: body === undefined ? undefined : JSON.stringify(body)});
  } catch (e) { const er = new Error('Tidak ada koneksi ke server.'); er.net = true; throw er; }
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && !path.startsWith('/api/login') && S.role) { S.role = null; render(); d.error = 'Sesi berakhir, silakan login lagi.'; toast(d.error, true); }
  if (!r.ok || d.ok === false) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok) throw new Error('copy gagal');
}

function clearTimers() { S.timers.forEach(clearInterval); S.timers = []; }

function track(id, base, done) {
  const log = $('#joblog');
  if (log) { log.style.display = 'block'; log.textContent = 'Job ' + id + ' berjalan…'; }
  const tick = async () => {
    try {
      const {job} = await api('GET', base + '/' + id);
      const l = $('#joblog');
      if (l) { l.style.display = 'block'; l.textContent = '[' + job.kind + ' ' + job.name + '] ' + job.status.toUpperCase() + '\n' + (job.output || ''); }
      if (job.status === 'running') return setTimeout(tick, 3000);
      toast(job.kind + ' ' + job.name + (job.status === 'done' ? ' selesai' : ' gagal'), job.status !== 'done');
      if (done) done(job);
    } catch (e) { if (e.net) return setTimeout(tick, 5000); toast(e.message, true); }
  };
  setTimeout(tick, 1500);
}

function bar(label, pct, sub) {
  const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="m"><div class="mh"><span>${label}</span><span>${sub}</span></div><div class="bar"><i class="${p>=90?'hi':p>=70?'md':''}" style="width:${p}%"></i></div></div>`;
}

function resHtml(r) {
  const bw = r.bw;
  const bwBar = bw.quota > 0
    ? bar('Bandwidth', bw.used / bw.quota * 100, fb(bw.used) + ' / ' + fb(bw.quota) + (bw.exhausted ? ' · HABIS' : ''))
    : `<div class="m"><div class="mh"><span>Bandwidth</span><span>${fb(bw.used)} · unlimited</span></div></div>`;
  return bar('CPU', r.cpu.pct, r.cpu.pct == null ? 'mengukur…' : r.cpu.pct + '% · ' + r.cpu.cores + ' core')
    + bar('RAM', r.ram.pct, fb(r.ram.used) + ' / ' + fb(r.ram.limit))
    + bar('Disk', r.disk.pct, r.disk.used == null ? 'n/a' : fb(r.disk.used) + ' / ' + fb(r.disk.limit))
    + bwBar
    + `<div class="mut" style="font-size:12px">Network sesi ini: ↓ ${fb(r.net.rx)} · ↑ ${fb(r.net.tx)} · Proses: ${r.procs}` + (bw.rate > 0 ? ` · Limit ${bw.rate} Mbps` : '') + `</div>`;
}

function stateBadge(v) {
  const st = v.suspended ? 'SUSPEND' : v.state;
  return `<span class="badge b-${esc(st)}">${esc(st)}</span>`;
}

function portsTable(v) {
  if (!v.ports.length) return '<div class="mut">Tidak ada port.</div>';
  const app = v.ports.filter(p => !p.ssh).length;
  return `<div class="mut" style="font-size:12px;margin-bottom:6px">${v.ports.length} port · 1 SSH · ${app} aplikasi</div><div class="tw"><table style="min-width:320px"><tr><th>Publik</th><th>Internal</th><th>Proto</th><th></th></tr>`
    + v.ports.map(p => `<tr><td>${esc(v.host)}:${p.public}</td><td>${p.internal}</td><td>${esc(p.proto)}${p.ssh ? ' · <b>SSH</b>' : ''}</td><td><button class="sm sec" data-a="copy" data-t="${esc(v.host)}:${p.public}" title="Salin">${ic('copy')}</button></td></tr>`).join('') + '</table></div>';
}

function vstats(l) {
  const sum = f => l.reduce((t, v) => t + (f(v) || 0), 0);
  const run = l.filter(v => v.state === 'RUNNING' && !v.suspended).length, sus = l.filter(v => v.suspended).length;
  const soon = l.filter(v => v.expires && daysLeft(v.expires) <= 7).length;
  const used = sum(v => v.bw.used), ports = sum(v => v.ports.length);
  const c = (cls, n, lbl, sm) => `<div class="stat ${cls}"><b>${n}</b><span>${lbl}</span>${sm ? `<small>${sm}</small>` : ''}</div>`;
  return c('', l.length, 'Total VPS', ports + ' port aktif') + c('ok', run, 'Running') + c(l.length - run - sus ? 'bad' : '', l.length - run - sus, 'Stopped') + c(sus ? 'warn' : '', sus, 'Suspend')
    + c(soon ? 'warn' : '', soon, 'Expired ≤ 7 hari') + c('', sum(v => v.cpu) + ' CPU', 'Alokasi CPU', fmb(sum(v => v.ram)) + ' RAM · ' + sum(v => v.disk) + ' GB disk') + c('', fb(used), 'Bandwidth terpakai');
}

function vcard(v) {
  const bw = v.bw, p = bw.quota > 0 ? Math.min(100, bw.used / bw.quota * 100) : null;
  const d = daysLeft(v.expires), ecls = v.expires && d <= 7 ? 'warnt' : '';
  return `<div class="vc" data-a="open" data-n="${esc(v.name)}" tabindex="0" role="button" aria-label="Buka ${esc(v.name)}">
    <div class="vh"><b>${esc(v.name)}</b>${stateBadge(v)}</div>
    <div class="vs">${esc(v.plan)} · ${esc(v.backend)}${v.owner && v.owner !== '-' ? ' · ' + esc(v.owner) : ''}</div>
    <div class="chips"><span class="chip">${v.cpu} CPU</span><span class="chip">${fmb(v.ram)}</span><span class="chip">${v.disk} GB</span><span class="chip">${v.ports.length} port</span></div>
    ${p == null ? `<div class="mh"><span>Bandwidth</span><span>${fb(bw.used)} · ∞</span></div>` : bar('Bandwidth', p, fb(bw.used) + ' / ' + fb(bw.quota) + (bw.exhausted ? ' · HABIS' : ''))}
    <div class="vf"><span>SSH :${v.ssh}${bw.rate > 0 ? ' · ' + bw.rate + ' Mbps' : ''}</span><span class="${ecls}">${v.expires ? esc(fexp(v.expires)) : 'Tanpa expired'}</span></div></div>`;
}

function renderVlist() {
  const q = (S.q || '').toLowerCase(), f = S.f || 'all', el = $('#vlist'); if (!el) return;
  const l = (S.vps || []).filter(v => (!q || v.name.toLowerCase().includes(q) || String(v.owner).toLowerCase().includes(q) || String(v.ssh).includes(q))
    && (f === 'all' || (f === 'RUNNING' && v.state === 'RUNNING' && !v.suspended) || (f === 'STOPPED' && v.state !== 'RUNNING' && !v.suspended)
      || (f === 'SUSPEND' && v.suspended) || (f === 'EXP' && v.expires && daysLeft(v.expires) <= 7)));
  el.innerHTML = l.length ? l.map(vcard).join('') : `<div class="empty" style="grid-column:1/-1">${ic('inbox')}${(S.vps || []).length ? 'Tidak ada VPS yang cocok dengan filter.' : 'Belum ada VPS. Buat lewat tab "Buat VPS".'}</div>`;
}

function curlOf(e) {
  const [m, p, , , ex] = e, o = location.origin;
  const url = o + p.replace('{name}', 'NAMA').replace('{id}', 'JOB_ID').replace('{port}', '20011');
  const pub = /^\/api\/(login|logout|session)/.test(p), usr = p.startsWith('/api/me');
  const auth = pub ? "-c cookie.txt -b cookie.txt -H 'X-Requested-With: vpsnat'" : usr ? "-b cookie.txt -H 'X-Requested-With: vpsnat'" : '-H "Authorization: Bearer $KEY"';
  const body = ex ? ` -H 'Content-Type: application/json' -d '${ex}'` : '';
  return `curl${m === 'GET' ? '' : ' -X ' + m} ${auth}${body} ${url}`;
}

function epHtml(e) {
  const [m, p, d, f, , res, note] = e, curl = curlOf(e);
  return `<details class="ep" data-s="${esc((m + ' ' + p + ' ' + d).toLowerCase())}"><summary><span class="mth m-${m}">${m}</span><span class="pth">${esc(p)}</span><span class="sd">${esc(d.split('. ')[0].replace(/\.$/, ''))}</span></summary><div class="bd">
    <p>${esc(d)}</p>
    ${f.length ? `<div class="tw"><table><tr><th>Field</th><th>Tipe</th><th>Wajib</th><th>Keterangan</th></tr>${f.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="wrap">${esc(r[3])}</td></tr>`).join('')}</table></div>` : ''}
    <button class="sm sec cp" data-a="copy" data-t="${esc(curl)}">${ic('copy')} Salin curl</button><pre>${esc(curl)}</pre>
    <h3 style="margin-top:12px">Respons</h3><pre>${esc(res)}</pre>
    ${note ? `<p class="mut" style="margin:8px 0 0">${esc(note)}</p>` : ''}</div></details>`;
}

function filterApi(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.grp').forEach(g => {
    let n = 0;
    g.querySelectorAll('.ep').forEach(e => { const on = !q || e.dataset.s.includes(q); e.hidden = !on; if (on) n++; });
    g.hidden = !n;
  });
}

function closeSheet() { clearInterval(S.sheetTimer); S.sheetTimer = null; const e = $('#sheet'); if (e) e.remove(); S.sel = null; document.body.style.overflow = ''; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet')) return A.close();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('vc')) { e.preventDefault(); A.open(e.target); }
});

// ---------- PWA ----------
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function syncInstall() {
  document.querySelectorAll('[data-install]').forEach(b => { b.hidden = !S.pwa; });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone();
  document.querySelectorAll('[data-ioshint]').forEach(b => { b.hidden = !ios; });
}
function netState() { const n = $('#net'); if (n) n.hidden = navigator.onLine; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.pwa = e; syncInstall(); });
window.addEventListener('appinstalled', () => { S.pwa = null; syncInstall(); toast('Aplikasi terpasang'); });
window.addEventListener('online', () => { netState(); toast('Kembali online'); });
window.addEventListener('offline', netState);
// Service worker butuh HTTPS (atau localhost). Lewat http://IP:port panel tetap jalan, hanya tanpa PWA.
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Versi panel baru tersedia. Muat ulang halaman untuk memakainya.'); });
    });
  }).catch(() => {});
}

async function boot() {
  S.offline = false;
  try { const d = await api('GET', '/api/session'); S.role = d.role; S.name = d.name; S.brand = d.brand || S.brand; S.logo = d.logo || ''; }
  catch (e) { if (e.net) S.offline = true; }
  render();
}
netState();
boot();
</script>
</body>
</html>
