<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VPSNAT Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--card2:#f1f5f9;--line:#e2e8f0;--tx:#0f172a;--mut:#64748b;--ac:#2563eb;--ac2:#1d4ed8;--acs:#eff6ff;--ok:#16a34a;--oks:#f0fdf4;--warn:#d97706;--warns:#fffbeb;--bad:#dc2626;--bads:#fef2f2;--dark:#0f172a;--r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}
.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo .mk img{width:100%;height:100%;object-fit:cover}
.logo small{color:var(--mut);font-weight:500;font-size:12px}
#app{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1,h2,h3{margin:0 0 10px;letter-spacing:-.2px}h1{font-size:22px}h2{font-size:16px}h3{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:14px}.grid>.card{margin-bottom:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center}.kv span:nth-child(odd){color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input::placeholder{color:#94a3b8}
label{display:block;color:var(--mut);font-size:12px;font-weight:500;margin:10px 0 4px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:10px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
button:hover{background:var(--ac2)}button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:not-allowed}
button.sec{background:#fff;border-color:var(--line);color:var(--tx)}button.sec:hover{background:var(--card2)}
button.ok{background:var(--ok);border-color:var(--ok)}button.ok:hover{background:#15803d}
button.bad{background:var(--bad);border-color:var(--bad)}button.bad:hover{background:#b91c1c}
button.warn{background:var(--warn);border-color:var(--warn)}button.warn:hover{background:#b45309}
button.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--card2);padding:5px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{background:transparent;border-color:transparent;color:var(--mut);padding:7px 14px}
.tabs button:hover{background:#fff;color:var(--tx)}
.tabs button.on{background:#fff;color:var(--ac);border-color:var(--line);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.b-RUNNING{background:var(--oks);color:var(--ok)}.b-STOPPED,.b-MISSING{background:var(--bads);color:var(--bad)}.b-SUSPEND{background:var(--warns);color:var(--warn)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}.bar i.md{background:var(--warn)}.bar i.hi{background:var(--bad)}
.m{margin-bottom:12px}.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}.mh span:first-child{color:var(--tx);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px;font-weight:600;background:#fafbfd}
tr.click{cursor:pointer}tr.click:hover{background:var(--acs)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
code{background:var(--card2);padding:2px 7px;border-radius:6px;word-break:break-all}
pre{background:var(--dark);color:#e2e8f0;border-radius:10px;padding:12px;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word;margin:10px 0 0}
.mut{color:var(--mut)}.err{color:var(--bad)}.warnt{color:var(--warn)}
.login{max-width:430px;margin:5vh auto 0}
.login .hero{text-align:center;margin-bottom:18px}
.login .hero .mk{width:56px;height:56px;border-radius:16px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto 12px;overflow:hidden;box-shadow:0 8px 20px rgba(37,99,235,.3)}
.login .hero .mk img{width:100%;height:100%;object-fit:cover}.login .hero .mk .ic{width:28px;height:28px}
.login .hero p{margin:4px 0 0;color:var(--mut)}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);overflow:auto;z-index:20;padding:12px}
.sheet>.in{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:#fff;border-left:4px solid var(--ok);border-radius:10px;padding:11px 18px;z-index:50;max-width:92vw;box-shadow:0 10px 30px rgba(15,23,42,.3)}
.toast.e{border-left-color:var(--bad)}
.danger{border-color:#fecaca;background:#fffafa}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.cols2{display:grid;gap:10px;grid-template-columns:1fr 1fr}.cols3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;letter-spacing:-.3px;line-height:1.2}.stat span{color:var(--mut);font-size:12px}.stat small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.fbar{display:grid;gap:8px;grid-template-columns:1fr 150px;margin-bottom:12px}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.vc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.vc:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(37,99,235,.12)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}.vc .vh b{font-size:15px;word-break:break-all}
.vc .vs{color:var(--mut);font-size:12px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{background:var(--card2);color:var(--tx);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500}
.vc .vf{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px;margin-top:8px}
.vc .m{margin-bottom:0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
@media(max-width:520px){.fbar{grid-template-columns:1fr}.cols3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:92px 1fr}.nav .in{padding:9px 12px}}
</style>
</head>
<body>
<div id="nav"></div>
<div id="app"></div>
<script nonce="{{NONCE}}">
'use strict';
const S = {role:null, name:null, tab:'vps', vps:[], sel:null, me:null, timers:[], brand:'VPSNAT', logo:''};
const ICONS = {
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  refresh:'<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  play:'<polygon points="5 3 19 12 5 21 5 3"/>',
  rotate:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
  stop:'<rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  server:'<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
function mark() { return S.logo ? `<img src="${esc(S.logo)}" alt="">` : ic('server'); }
function setNav(right, tag) {
  $('#nav').innerHTML = `<div class="nav"><div class="in"><div class="logo"><span class="mk">${mark()}</span><span>${esc(S.brand)}${tag ? ` <small>${esc(tag)}</small>` : ''}</span></div><div class="row">${right || ''}</div></div></div>`;
}
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const fb = b => { b = Number(b)||0; if (b>=1e12) return (b/1e12).toFixed(2)+' TB'; if (b>=1e9) return (b/1e9).toFixed(2)+' GB'; if (b>=1e6) return (b/1e6).toFixed(1)+' MB'; if (b>=1e3) return (b/1e3).toFixed(0)+' KB'; return b+' B'; };
const fdate = e => e ? new Date(e*1000).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : 'Tanpa expired';
const fup = s => { const d=Math.floor(s/86400), h=Math.floor(s%86400/3600); return d+'h '+h+'j'; };
const fmb = m => { m = Number(m)||0; return m >= 1024 ? (m/1024).toFixed(m % 1024 ? 1 : 0) + ' GB' : m + ' MB'; };
const daysLeft = e => e ? Math.ceil((e*1000 - Date.now())/864e5) : null;
const fexp = e => { if (!e) return '∞'; const d = daysLeft(e); return d < 0 ? 'Expired' : d === 0 ? 'Hari ini' : d + ' hari lagi'; };
const IMAGES = ['ubuntu24','ubuntu22','ubuntu20','debian12','debian11','alma9','rocky9','alpine'];
const opts = (list, sel) => list.map(x => `<option value="${esc(x)}"${x===sel?' selected':''}>${esc(x)}</option>`).join('');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' e' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

async function api(method, path, body) {
  const r = await fetch(path, {method, credentials:'same-origin',
    headers:{'Content-Type':'application/json','X-Requested-With':'vpsnat'},
    body: body === undefined ? undefined : JSON.stringify(body)});
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && !path.startsWith('/api/login') && S.role) { S.role = null; render(); d.error = 'Sesi berakhir, silakan login lagi.'; toast(d.error, true); }
  if (!r.ok || d.ok === false) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (!ok) throw new Error('copy gagal');
}

function clearTimers() { S.timers.forEach(clearInterval); S.timers = []; }

function track(id, base, done) {
  const log = $('#joblog');
  if (log) { log.style.display = 'block'; log.textContent = 'Job ' + id + ' berjalan…'; }
  const tick = async () => {
    try {
      const {job} = await api('GET', base + '/' + id);
      const l = $('#joblog');
      if (l) { l.style.display = 'block'; l.textContent = '[' + job.kind + ' ' + job.name + '] ' + job.status.toUpperCase() + '\n' + (job.output || ''); }
      if (job.status === 'running') return setTimeout(tick, 3000);
      toast(job.kind + ' ' + job.name + (job.status === 'done' ? ' selesai' : ' gagal'), job.status !== 'done');
      if (done) done(job);
    } catch (e) { toast(e.message, true); }
  };
  setTimeout(tick, 1500);
}

function bar(label, pct, sub) {
  const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="m"><div class="mh"><span>${label}</span><span>${sub}</span></div><div class="bar"><i class="${p>=90?'hi':p>=70?'md':''}" style="width:${p}%"></i></div></div>`;
}

function resHtml(r) {
  const bw = r.bw;
  const bwBar = bw.quota > 0
    ? bar('Bandwidth', bw.used / bw.quota * 100, fb(bw.used) + ' / ' + fb(bw.quota) + (bw.exhausted ? ' · HABIS' : ''))
    : `<div class="m"><div class="mh"><span>Bandwidth</span><span>${fb(bw.used)} · unlimited</span></div></div>`;
  return bar('CPU', r.cpu.pct, r.cpu.pct == null ? 'mengukur…' : r.cpu.pct + '% · ' + r.cpu.cores + ' core')
    + bar('RAM', r.ram.pct, fb(r.ram.used) + ' / ' + fb(r.ram.limit))
    + bar('Disk', r.disk.pct, r.disk.used == null ? 'n/a' : fb(r.disk.used) + ' / ' + fb(r.disk.limit))
    + bwBar
    + `<div class="mut" style="font-size:12px">Network sesi ini: ↓ ${fb(r.net.rx)} · ↑ ${fb(r.net.tx)} · Proses: ${r.procs}` + (bw.rate > 0 ? ` · Limit ${bw.rate} Mbps` : '') + `</div>`;
}

function stateBadge(v) {
  const st = v.suspended ? 'SUSPEND' : v.state;
  return `<span class="badge b-${esc(st)}">${esc(st)}</span>`;
}

function portsTable(v) {
  if (!v.ports.length) return '<div class="mut">Tidak ada port.</div>';
  const app = v.ports.filter(p => !p.ssh).length;
  return `<div class="mut" style="font-size:12px;margin-bottom:6px">${v.ports.length} port · 1 SSH · ${app} aplikasi</div><div class="tw"><table style="min-width:320px"><tr><th>Publik</th><th>Internal</th><th>Proto</th><th></th></tr>`
    + v.ports.map(p => `<tr><td>${esc(v.host)}:${p.public}</td><td>${p.internal}</td><td>${esc(p.proto)}${p.ssh ? ' · <b>SSH</b>' : ''}</td><td><button class="sm sec" data-a="copy" data-t="${esc(v.host)}:${p.public}" title="Salin">${ic('copy')}</button></td></tr>`).join('') + '</table></div>';
}

function infoKv(v, admin) {
  return `<div class="kv">
    <span>Status</span><span>${stateBadge(v)}${v.suspended ? ' <span class="warnt">(' + esc(v.reason) + ')</span>' : ''}</span>
    <span>Tipe</span><span>${esc(v.plan)} · ${esc(v.backend)}</span>
    <span>Spesifikasi</span><span>${v.cpu} CPU · ${v.ram} MB RAM · ${v.disk} GB</span>
    <span>Dibuat</span><span>${esc(v.created)}</span>
    <span>Expired</span><span>${esc(fdate(v.expires))}</span>
    ${admin ? `<span>Owner</span><span>${esc(v.owner)}</span><span>IP lokal</span><span>${esc(v.ip)}</span>` : ''}
    <span>SSH</span><span><code>ssh root@${esc(v.host)} -p ${v.ssh}</code> <button class="sm sec" data-a="copy" data-t="ssh root@${esc(v.host)} -p ${v.ssh}">${ic('copy')} Salin</button></span>
    <span>Password</span><span><code id="pw" data-pw="${esc(v.password)}">••••••••</code> <button class="sm sec" data-a="reveal">${ic('eye')} Tampilkan</button> <button class="sm sec" data-a="copy" data-t="${esc(v.password)}">${ic('copy')} Salin</button></span>
  </div>`;
}

// ---------- login ----------
function renderLogin() {
  const mode = S.loginMode || 'user';
  $('#nav').innerHTML = '';
  $('#app').innerHTML = `<div class="login"><div class="hero"><div class="mk">${mark()}</div><h1>${esc(S.brand)}</h1><p>Kelola VPS kamu dari satu panel</p></div><div class="card">
    <div class="tabs" style="width:100%"><button style="flex:1" class="${mode==='user'?'on':''}" data-a="lm" data-m="user">Login VPS</button><button style="flex:1" class="${mode==='admin'?'on':''}" data-a="lm" data-m="admin">Admin</button></div>
    ${mode === 'user'
      ? `<label>Nama VPS atau port SSH</label><input id="l1" autocomplete="username" autocapitalize="none" placeholder="mis. myvps atau 20010">
         <label>Password root</label><input id="l2" type="password" autocomplete="current-password">`
      : `<label>Username</label><input id="l1" autocomplete="username" autocapitalize="none">
         <label>Password</label><input id="l2" type="password" autocomplete="current-password">`}
    <div style="margin-top:16px"><button data-a="login" style="width:100%">Masuk</button></div>
    <div id="lerr" class="err" style="margin-top:10px"></div>
  </div><div class="foot">Gunakan nama VPS atau port SSH + password root VPS</div></div>`;
  const go = e => { if (e.key === 'Enter') $('[data-a=login]').click(); };
  $('#l1').addEventListener('keydown', go); $('#l2').addEventListener('keydown', go);
}

async function doLogin(btn) {
  const mode = S.loginMode || 'user';
  btn.disabled = true;
  try {
    const body = mode === 'user' ? {identifier: val('l1'), password: $('#l2').value} : {username: val('l1'), password: $('#l2').value};
    const d = await api('POST', '/api/login/' + mode, body);
    S.role = d.role; S.name = d.name || null;
    render();
  } catch (e) { $('#lerr').textContent = e.message; btn.disabled = false; }
}

async function logout() {
  try { await api('POST', '/api/logout', {}); } catch (e) {}
  S.role = null; S.me = null; S.sel = null; render();
}

// ---------- user ----------
async function renderUser() {
  clearTimers();
  try { S.me = (await api('GET', '/api/me')).vps; } catch (e) { return toast(e.message, true); }
  const v = S.me;
  setNav(`<button class="sec sm" data-a="logout">${ic('out')} Keluar</button>`, 'VPS');
  $('#app').innerHTML = `
    <div class="top"><h1>${esc(v.name)} ${stateBadge(v)}</h1></div>
    <div class="grid">
      <div class="card"><h2>Informasi</h2>${infoKv(v, false)}</div>
      <div class="card"><h2>Resource</h2><div id="res" class="mut">Memuat…</div></div>
    </div>
    <div class="card"><h2>Port</h2>${portsTable(v)}</div>
    <div class="grid">
      <div class="card"><h2>Kontrol</h2>
        <div class="row"><button class="ok" data-a="mepower" data-p="start">${ic('play')} Start</button><button class="warn" data-a="mepower" data-p="restart">${ic('rotate')} Restart</button><button class="bad" data-a="mepower" data-p="stop">${ic('stop')} Stop</button></div>

function vstats(l) {
  const sum = f => l.reduce((t, v) => t + (f(v) || 0), 0);
  const run = l.filter(v => v.state === 'RUNNING' && !v.suspended).length, sus = l.filter(v => v.suspended).length;
  const soon = l.filter(v => v.expires && daysLeft(v.expires) <= 7).length;
  const used = sum(v => v.bw.used), ports = sum(v => v.ports.length);
  const c = (cls, n, lbl, sm) => `<div class="stat ${cls}"><b>${n}</b><span>${lbl}</span>${sm ? `<small>${sm}</small>` : ''}</div>`;
  return c('', l.length, 'Total VPS', ports + ' port aktif') + c('ok', run, 'Running') + c(l.length - run - sus ? 'bad' : '', l.length - run - sus, 'Stopped') + c(sus ? 'warn' : '', sus, 'Suspend')
    + c(soon ? 'warn' : '', soon, 'Expired ≤ 7 hari') + c('', sum(v => v.cpu) + ' CPU', 'Alokasi CPU', fmb(sum(v => v.ram)) + ' RAM · ' + sum(v => v.disk) + ' GB disk') + c('', fb(used), 'Bandwidth terpakai');
}

function vcard(v) {
  const bw = v.bw, p = bw.quota > 0 ? Math.min(100, bw.used / bw.quota * 100) : null;
  const d = daysLeft(v.expires), ecls = v.expires && d <= 7 ? 'warnt' : '';
  return `<div class="vc" data-a="open" data-n="${esc(v.name)}">
    <div class="vh"><b>${esc(v.name)}</b>${stateBadge(v)}</div>
    <div class="vs">${esc(v.plan)} · ${esc(v.backend)}${v.owner && v.owner !== '-' ? ' · ' + esc(v.owner) : ''}</div>
    <div class="chips"><span class="chip">${v.cpu} CPU</span><span class="chip">${fmb(v.ram)}</span><span class="chip">${v.disk} GB</span><span class="chip">${v.ports.length} port</span></div>
    ${p == null ? `<div class="mh"><span>Bandwidth</span><span>${fb(bw.used)} · ∞</span></div>` : bar('Bandwidth', p, fb(bw.used) + ' / ' + fb(bw.quota) + (bw.exhausted ? ' · HABIS' : ''))}
    <div class="vf"><span>SSH :${v.ssh}${bw.rate > 0 ? ' · ' + bw.rate + ' Mbps' : ''}</span><span class="${ecls}">${v.expires ? esc(fexp(v.expires)) : 'Tanpa expired'}</span></div></div>`;
}

function renderVlist() {
  const q = (S.q || '').toLowerCase(), f = S.f || 'all', el = $('#vlist'); if (!el) return;
  const l = (S.vps || []).filter(v => (!q || v.name.toLowerCase().includes(q) || String(v.owner).toLowerCase().includes(q) || String(v.ssh).includes(q))
    && (f === 'all' || (f === 'RUNNING' && v.state === 'RUNNING' && !v.suspended) || (f === 'STOPPED' && v.state !== 'RUNNING' && !v.suspended)
      || (f === 'SUSPEND' && v.suspended) || (f === 'EXP' && v.expires && daysLeft(v.expires) <= 7)));
  el.innerHTML = l.length ? l.map(vcard).join('') : `<div class="empty" style="grid-column:1/-1">${(S.vps || []).length ? 'Tidak ada VPS yang cocok dengan filter.' : 'Belum ada VPS. Buat lewat tab "Buat VPS".'}</div>`;

    const d = await api('POST', '/api/admin/vps', body);
    S.tab = 'vps'; renderAdmin(); toast('Pembuatan dimulai');
    track(d.job, '/api/admin/jobs', () => tabVps());
  }),
  sync: b => act(b, async () => { const d = await api('POST', '/api/admin/sync', {}); toast('Sync selesai'); }),
  nodes: b => act(b, async () => { const d = await api('GET', '/api/admin/nodes'); const p = $('#nodesout'); p.style.display = 'block'; p.textContent = d.output; }),
  setting: b => act(b, async () => { await api('POST', '/api/admin/settings', {key: val('s_key'), value: val('s_val')}); toast('Setting disimpan'); tabHost(); }),
};

document.addEventListener('input', e => {
  if (e.target.id === 'vq') { S.q = e.target.value; renderVlist(); }
  else if (e.target.id === 'vf') { S.f = e.target.value; renderVlist(); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el);
});

(async () => {
  try { const d = await api('GET', '/api/session'); S.role = d.role; S.name = d.name; S.brand = d.brand || S.brand; S.logo = d.logo || ''; } catch (e) {}
  render();
})();
</script>
</body>
</html>
