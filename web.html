<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VPSNAT Panel</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--card2:#18223d;--line:#26335a;--tx:#e6ebff;--mut:#8b97c4;--ac:#5b8cff;--ok:#2fd28b;--warn:#f5b63d;--bad:#ff5c72;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--ac)}
#app{max-width:1100px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0 0 10px}h2{font-size:16px}h3{font-size:14px;color:var(--mut);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-weight:700;font-size:18px}.brand small{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px}.kv span:nth-child(odd){color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;color:var(--mut);font-size:12px;margin:8px 0 3px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.sec{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
button.ok{background:#1f9d6b}button.bad{background:#d8405a}button.warn{background:#c98a14}
button.sm{padding:5px 10px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.b-RUNNING{color:var(--ok);border-color:var(--ok)}.b-STOPPED,.b-MISSING{color:var(--bad);border-color:var(--bad)}.b-SUSPEND{color:var(--warn);border-color:var(--warn)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}.bar i.md{background:var(--warn)}.bar i.hi{background:var(--bad)}
.m{margin-bottom:11px}.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px;font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:var(--card2)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
code{background:var(--card2);padding:2px 6px;border-radius:6px;word-break:break-all}
pre{background:#080c19;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
.mut{color:var(--mut)}.err{color:var(--bad)}.warnt{color:var(--warn)}
.login{max-width:420px;margin:8vh auto 0}
.sheet{position:fixed;inset:0;background:rgba(5,8,18,.82);overflow:auto;z-index:20;padding:12px}
.sheet>.in{max-width:900px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 16px;z-index:50;max-width:92vw}
.toast.e{border-left-color:var(--bad)}
.danger{border-color:#5a2230}
.cols2{display:grid;gap:10px;grid-template-columns:1fr 1fr}.cols3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.cols3{grid-template-columns:1fr 1fr}.kv{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script nonce="{{NONCE}}">
'use strict';
const S = {role:null, name:null, tab:'vps', vps:[], sel:null, me:null, timers:[]};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const fb = b => { b = Number(b)||0; if (b>=1e12) return (b/1e12).toFixed(2)+' TB'; if (b>=1e9) return (b/1e9).toFixed(2)+' GB'; if (b>=1e6) return (b/1e6).toFixed(1)+' MB'; if (b>=1e3) return (b/1e3).toFixed(0)+' KB'; return b+' B'; };
const fdate = e => e ? new Date(e*1000).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : 'Tanpa expired';
const fup = s => { const d=Math.floor(s/86400), h=Math.floor(s%86400/3600); return d+'h '+h+'j'; };
const IMAGES = ['ubuntu24','ubuntu22','ubuntu20','debian12','debian11','alma9','rocky9','alpine'];
const opts = (list, sel) => list.map(x => `<option value="${esc(x)}"${x===sel?' selected':''}>${esc(x)}</option>`).join('');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' e' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

async function api(method, path, body) {
  const r = await fetch(path, {method, credentials:'same-origin',
    headers:{'Content-Type':'application/json','X-Requested-With':'vpsnat'},
    body: body === undefined ? undefined : JSON.stringify(body)});
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && !path.startsWith('/api/login') && S.role) { S.role = null; render(); }
  if (!r.ok || d.ok === false) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

async function act(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

function clearTimers() { S.timers.forEach(clearInterval); S.timers = []; }

function track(id, base, done) {
  const log = $('#joblog');
  if (log) { log.style.display = 'block'; log.textContent = 'Job ' + id + ' berjalan…'; }
  const tick = async () => {
    try {
      const {job} = await api('GET', base + '/' + id);
      const l = $('#joblog');
      if (l) l.textContent = '[' + job.kind + ' ' + job.name + '] ' + job.status.toUpperCase() + '\n' + (job.output || '');
      if (job.status === 'running') return setTimeout(tick, 3000);
      toast(job.kind + ' ' + job.name + (job.status === 'done' ? ' selesai' : ' gagal'), job.status !== 'done');
      if (done) done(job);
    } catch (e) { toast(e.message, true); }
  };
  setTimeout(tick, 1500);
}

function bar(label, pct, sub) {
  const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div class="m"><div class="mh"><span>${label}</span><span>${sub}</span></div><div class="bar"><i class="${p>=90?'hi':p>=70?'md':''}" style="width:${p}%"></i></div></div>`;
}

function resHtml(r) {
  const bw = r.bw;
  const bwBar = bw.quota > 0
    ? bar('Bandwidth', bw.used / bw.quota * 100, fb(bw.used) + ' / ' + fb(bw.quota) + (bw.exhausted ? ' · HABIS' : ''))
    : `<div class="m"><div class="mh"><span>Bandwidth</span><span>${fb(bw.used)} · unlimited</span></div></div>`;
  return bar('CPU', r.cpu.pct, r.cpu.pct == null ? 'mengukur…' : r.cpu.pct + '% · ' + r.cpu.cores + ' core')
    + bar('RAM', r.ram.pct, fb(r.ram.used) + ' / ' + fb(r.ram.limit))
    + bar('Disk', r.disk.pct, r.disk.used == null ? 'n/a' : fb(r.disk.used) + ' / ' + fb(r.disk.limit))
    + bwBar
    + `<div class="mut" style="font-size:12px">Network sesi ini: ↓ ${fb(r.net.rx)} · ↑ ${fb(r.net.tx)} · Proses: ${r.procs}` + (bw.rate > 0 ? ` · Limit ${bw.rate} Mbps` : '') + `</div>`;
}

function stateBadge(v) {
  const st = v.suspended ? 'SUSPEND' : v.state;
  return `<span class="badge b-${esc(st)}">${esc(st)}</span>`;
}

function portsTable(v) {
  if (!v.ports.length) return '<div class="mut">Tidak ada port.</div>';
  return '<div class="tw"><table style="min-width:360px"><tr><th>Publik</th><th>Internal</th><th>Proto</th></tr>'
    + v.ports.map(p => `<tr><td>${esc(v.host)}:${p.public}</td><td>${p.internal}</td><td>${esc(p.proto)}${p.ssh ? ' · SSH' : ''}</td></tr>`).join('') + '</table></div>';
}

function infoKv(v, admin) {
  return `<div class="kv">
    <span>Status</span><span>${stateBadge(v)}${v.suspended ? ' <span class="warnt">(' + esc(v.reason) + ')</span>' : ''}</span>
    <span>Tipe</span><span>${esc(v.plan)} · ${esc(v.backend)}</span>
    <span>Spesifikasi</span><span>${v.cpu} CPU · ${v.ram} MB RAM · ${v.disk} GB</span>
    <span>Dibuat</span><span>${esc(v.created)}</span>
    <span>Expired</span><span>${esc(fdate(v.expires))}</span>
    ${admin ? `<span>Owner</span><span>${esc(v.owner)}</span><span>IP lokal</span><span>${esc(v.ip)}</span>` : ''}
    <span>SSH</span><span><code>ssh root@${esc(v.host)} -p ${v.ssh}</code> <button class="sm sec" data-a="copy" data-t="ssh root@${esc(v.host)} -p ${v.ssh}">Salin</button></span>
    <span>Password</span><span><code id="pw" data-pw="${esc(v.password)}">••••••••</code> <button class="sm sec" data-a="reveal">Tampilkan</button> <button class="sm sec" data-a="copy" data-t="${esc(v.password)}">Salin</button></span>
  </div>`;
}

// ---------- login ----------
function renderLogin() {
  const mode = S.loginMode || 'user';
  $('#app').innerHTML = `<div class="login"><div class="card">
    <div class="brand" style="margin-bottom:12px">VPSNAT<small>panel</small></div>
    <div class="tabs"><button class="${mode==='user'?'on':''}" data-a="lm" data-m="user">Login VPS</button><button class="${mode==='admin'?'on':''}" data-a="lm" data-m="admin">Admin</button></div>
    ${mode === 'user'
      ? `<label>Nama VPS atau port SSH</label><input id="l1" autocomplete="username" autocapitalize="none" placeholder="mis. myvps atau 20010">
         <label>Password root</label><input id="l2" type="password" autocomplete="current-password">`
      : `<label>Username</label><input id="l1" autocomplete="username" autocapitalize="none">
         <label>Password</label><input id="l2" type="password" autocomplete="current-password">`}
    <div style="margin-top:14px"><button data-a="login" style="width:100%">Masuk</button></div>
    <div id="lerr" class="err" style="margin-top:10px"></div>
  </div></div>`;
  const go = e => { if (e.key === 'Enter') $('[data-a=login]').click(); };
  $('#l1').addEventListener('keydown', go); $('#l2').addEventListener('keydown', go);
}

async function doLogin(btn) {
  const mode = S.loginMode || 'user';
  btn.disabled = true;
  try {
    const body = mode === 'user' ? {identifier: val('l1'), password: $('#l2').value} : {username: val('l1'), password: $('#l2').value};
    const d = await api('POST', '/api/login/' + mode, body);
    S.role = d.role; S.name = d.name || null;
    render();
  } catch (e) { $('#lerr').textContent = e.message; btn.disabled = false; }
}

async function logout() {
  try { await api('POST', '/api/logout', {}); } catch (e) {}
  S.role = null; S.me = null; S.sel = null; render();
}

// ---------- user ----------
async function renderUser() {
  try { S.me = (await api('GET', '/api/me')).vps; } catch (e) { return toast(e.message, true); }
  const v = S.me;
  $('#app').innerHTML = `
    <div class="top"><div class="brand">${esc(v.name)} ${stateBadge(v)}</div><button class="sec" data-a="logout">Keluar</button></div>
    <div class="grid">
      <div class="card"><h2>Informasi</h2>${infoKv(v, false)}</div>
      <div class="card"><h2>Resource</h2><div id="res" class="mut">Memuat…</div></div>
    </div>
    <div class="card"><h2>Port</h2>${portsTable(v)}</div>
    <div class="grid">
      <div class="card"><h2>Kontrol</h2>
        <div class="row"><button class="ok" data-a="mepower" data-p="start">Start</button><button class="warn" data-a="mepower" data-p="restart">Restart</button><button class="bad" data-a="mepower" data-p="stop">Stop</button></div>
        <h3 style="margin-top:16px">Ganti password root</h3>
        <input id="newpw" type="password" placeholder="Kosongkan untuk random" autocomplete="new-password">
        <div style="margin-top:8px"><button data-a="mepasswd">Ganti password</button></div>
      </div>
      <div class="card danger"><h2>Reinstall</h2>
        <div class="warnt" style="margin-bottom:6px">Semua data di dalam VPS akan hilang. Port, resource, dan expired tetap.</div>
        <label>Image</label><select id="rimg">${opts(IMAGES, 'ubuntu22')}</select>
        <label>Ketik nama VPS (<b>${esc(v.name)}</b>) untuk konfirmasi</label><input id="rconf" autocapitalize="none">
        <div style="margin-top:10px"><button class="bad" data-a="mereinstall">Reinstall</button></div>
      </div>
    </div>
    <pre id="joblog" style="display:none"></pre>`;
  const poll = async () => {
    try { $('#res').innerHTML = resHtml((await api('GET', '/api/me/resources')).res); } catch (e) {}
  };
  poll(); S.timers.push(setInterval(poll, 5000));
}

// ---------- admin ----------
function renderAdmin() {
  const tabs = [['vps','VPS'],['create','Buat VPS'],['host','Host & Setting'],['api','API']];
  $('#app').innerHTML = `
    <div class="top"><div class="brand">VPSNAT<small>admin</small></div><button class="sec" data-a="logout">Keluar</button></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="${S.tab===k?'on':''}" data-a="tab" data-k="${k}">${n}</button>`).join('')}</div>
    <div id="tab"></div><pre id="joblog" style="display:none"></pre>`;
  ({vps: tabVps, create: tabCreate, host: tabHost, api: tabApi})[S.tab]();
}

async function tabVps() {
  try { S.vps = (await api('GET', '/api/admin/vps')).vps; } catch (e) { return toast(e.message, true); }
  const rows = S.vps.map(v => `<tr class="click" data-a="open" data-n="${esc(v.name)}">
    <td><b>${esc(v.name)}</b></td><td>${stateBadge(v)}</td><td>${esc(v.plan)}/${esc(v.backend)}</td>
    <td>${v.cpu}c · ${v.ram}M · ${v.disk}G</td><td>${v.ssh}</td>
    <td>${fb(v.bw.used)}${v.bw.quota > 0 ? ' / ' + fb(v.bw.quota) : ''}</td><td>${v.expires ? esc(fdate(v.expires)) : '∞'}</td><td>${esc(v.owner)}</td></tr>`).join('');
  $('#tab').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${S.vps.length} VPS</h2><button class="sm sec" data-a="refresh">Refresh</button></div>
    <div class="tw"><table><tr><th>Nama</th><th>Status</th><th>Tipe</th><th>Spek</th><th>SSH</th><th>Bandwidth</th><th>Expired</th><th>Owner</th></tr>${rows || '<tr><td colspan="8" class="mut">Belum ada VPS.</td></tr>'}</table></div></div>`;
}

function tabCreate() {
  $('#tab').innerHTML = `<div class="card"><h2>Buat VPS baru</h2>
    <div class="cols2"><div><label>Nama (a-z, 0-9, -)</label><input id="c_name" autocapitalize="none"></div>
    <div><label>Image</label><select id="c_image">${opts(IMAGES, 'ubuntu22')}</select></div></div>
    <div class="cols3"><div><label>CPU</label><input id="c_cpu" type="number" value="1" min="1"></div>
    <div><label>RAM (MB)</label><input id="c_ram" type="number" value="1024" min="128"></div>
    <div><label>Disk (GB)</label><input id="c_disk" type="number" value="10" min="1"></div></div>
    <div class="cols3"><div><label>Tipe</label><select id="c_plan"><option>shared</option><option>dedicated</option></select></div>
    <div><label>Backend</label><select id="c_backend"><option>container</option><option>vm</option></select></div>
    <div><label>Jumlah port (2-10)</label><input id="c_ports" type="number" value="3" min="2" max="10"></div></div>
    <div class="cols3"><div><label>Expired (30d / 2026-12-31)</label><input id="c_expire" placeholder="kosong = tanpa"></div>
    <div><label>Kuota BW (GB)</label><input id="c_bwq" type="number" min="0" placeholder="default"></div>
    <div><label>Limit (Mbps)</label><input id="c_bwr" type="number" min="0" placeholder="default"></div></div>
    <div class="cols2"><div><label>Owner / label</label><input id="c_owner"></div>
    <div><label>Password root (kosong = random)</label><input id="c_pass" type="password" autocomplete="new-password"></div></div>
    <label style="display:flex;gap:8px;align-items:center"><input id="c_nest" type="checkbox" checked style="width:auto"> Nesting (Docker di dalam VPS, container saja)</label>
    <div style="margin-top:12px"><button data-a="create">Buat VPS</button></div></div>`;
}

async function tabHost() {
  $('#tab').innerHTML = '<div class="card mut">Memuat…</div>';
  try {
    const [h, s] = await Promise.all([api('GET', '/api/admin/host'), api('GET', '/api/admin/settings')]);
    const x = h.host;
    $('#tab').innerHTML = `<div class="grid"><div class="card"><h2>Host</h2><div class="kv">
      <span>Public IP</span><span>${esc(x.public_ip)}</span><span>CPU</span><span>${x.cores} core · load ${x.load.join(' ')}</span>
      <span>RAM</span><span>${fb(x.ram.total - x.ram.avail)} / ${fb(x.ram.total)}</span><span>Disk /</span><span>${fb(x.disk.used)} / ${fb(x.disk.total)}</span>
      <span>Uptime</span><span>${fup(x.uptime)}</span><span>VPS</span><span>${x.vps.total} total · ${x.vps.running} running · ${x.vps.suspended} suspend</span></div>
      <div class="row" style="margin-top:12px"><button class="sec" data-a="sync">Sync DB</button><button class="sec" data-a="nodes">Dashboard multi-node</button></div></div>
      <div class="card"><h2>Setting</h2><pre style="margin:0 0 10px">${esc(Object.entries(s.settings).map(([k, v]) => k + ' = ' + v).join('\n'))}</pre>
      <div class="cols2"><select id="s_key">${opts(s.keys)}</select><input id="s_val" placeholder="nilai"></div>
      <div style="margin-top:8px"><button data-a="setting">Simpan</button></div></div></div>
      <pre id="nodesout" style="display:none"></pre>`;
  } catch (e) { toast(e.message, true); }
}

function tabApi() {
  const o = location.origin;
  $('#tab').innerHTML = `<div class="card"><h2>API (khusus admin)</h2>
    <p class="mut">Header: <code>Authorization: Bearer &lt;WEB_API_KEY&gt;</code>. Key diatur lewat <code>vpsnat web key</code> di server. Semua body JSON.</p>
    <pre>curl -H "Authorization: Bearer $KEY" ${esc(o)}/api/admin/vps
curl -H "Authorization: Bearer $KEY" ${esc(o)}/api/admin/vps/NAMA/resources
curl -X POST -H "Authorization: Bearer $KEY" -d '{"action":"restart"}' ${esc(o)}/api/admin/vps/NAMA/action
curl -X POST -H "Authorization: Bearer $KEY" -d '{"name":"demo","cpu":2,"ram":2048,"disk":20,"image":"ubuntu22","plan":"shared","expire":"30d"}' ${esc(o)}/api/admin/vps</pre>
    <div class="tw"><table style="min-width:520px"><tr><th>Method</th><th>Path</th><th>Keterangan</th></tr>
    ${[['GET','/api/admin/host','info host + hitungan VPS'],['GET','/api/admin/vps','daftar VPS'],['POST','/api/admin/vps','buat VPS (job)'],['GET','/api/admin/vps/{n}','detail + password'],['DELETE','/api/admin/vps/{n}','hapus (job)'],['GET','/api/admin/vps/{n}/resources','CPU/RAM/disk/network'],['POST','/api/admin/vps/{n}/action','start|stop|restart|suspend|unsuspend'],['POST','/api/admin/vps/{n}/reinstall','{image} (job)'],['POST','/api/admin/vps/{n}/passwd','{password?}'],['POST','/api/admin/vps/{n}/resize','{cpu,ram,disk}'],['POST','/api/admin/vps/{n}/renew','{duration}'],['POST','/api/admin/vps/{n}/expire','{value}'],['POST','/api/admin/vps/{n}/owner','{owner}'],['POST','/api/admin/vps/{n}/plan','{plan}'],['POST','/api/admin/vps/{n}/bandwidth','{action:set|limit|reset,quota_gb,rate_mbit}'],['POST','/api/admin/vps/{n}/ports','{proto,count}'],['DELETE','/api/admin/vps/{n}/ports/{port}','hapus port'],['GET','/api/admin/settings','lihat setting'],['POST','/api/admin/settings','{key,value}'],['POST','/api/admin/sync','sync DB dengan LXD'],['GET','/api/admin/nodes','dashboard multi-node'],['GET','/api/admin/jobs[/{id}]','status job']].map(r => `<tr><td>${r[0]}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}</table></div>
    <p class="mut">Operasi panjang (create, delete, reinstall) mengembalikan <code>{"job":"id"}</code>; polling <code>/api/admin/jobs/{id}</code>.</p></div>`;
}

async function openVps(name) {
  let v, r;
  try { v = (await api('GET', '/api/admin/vps/' + name)).vps; } catch (e) { return toast(e.message, true); }
  S.sel = name;
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet'; el.id = 'sheet';
  el.innerHTML = `<div class="in">
    <div class="top"><div class="brand">${esc(v.name)} ${stateBadge(v)}</div><button class="sec" data-a="close">Tutup</button></div>
    <div class="grid"><div class="card"><h2>Info</h2>${infoKv(v, true)}</div><div class="card"><h2>Resource</h2><div id="res" class="mut">Memuat…</div></div></div>
    <div class="card"><h2>Kontrol</h2><div class="row">
      <button class="ok" data-a="power" data-p="start">Start</button><button class="warn" data-a="power" data-p="restart">Restart</button><button class="bad" data-a="power" data-p="stop">Stop</button>
      <button class="sec" data-a="power" data-p="suspend">Suspend</button><button class="sec" data-a="power" data-p="unsuspend">Unsuspend</button></div></div>
    <div class="grid">
      <div class="card"><h3>Resize</h3><div class="cols3"><div><label>CPU</label><input id="z_cpu" type="number" value="${v.cpu}"></div><div><label>RAM MB</label><input id="z_ram" type="number" value="${v.ram}"></div><div><label>Disk GB</label><input id="z_disk" type="number" value="${v.disk}"></div></div><div style="margin-top:8px"><button data-a="resize">Terapkan</button></div></div>
      <div class="card"><h3>Expired</h3><div class="cols2"><div><label>Perpanjang (30d)</label><input id="x_renew" placeholder="30d"></div><div><label>Set expire</label><input id="x_exp" placeholder="2026-12-31 / never"></div></div>
        <div class="row" style="margin-top:8px"><button data-a="renew">Renew</button><button class="sec" data-a="expire">Set expire</button></div></div>
      <div class="card"><h3>Password root</h3><input id="x_pw" type="password" placeholder="kosong = random" autocomplete="new-password"><div style="margin-top:8px"><button data-a="passwd">Ganti</button></div></div>
      <div class="card"><h3>Owner &amp; tipe</h3><div class="cols2"><input id="x_owner" value="${esc(v.owner === '-' ? '' : v.owner)}" placeholder="owner"><select id="x_plan"><option${v.plan==='shared'?' selected':''}>shared</option><option${v.plan==='dedicated'?' selected':''}>dedicated</option></select></div>
        <div class="row" style="margin-top:8px"><button data-a="owner">Simpan owner</button><button class="sec" data-a="plan">Simpan tipe</button></div></div>
      <div class="card"><h3>Bandwidth</h3><div class="cols2"><div><label>Kuota GB (0=∞)</label><input id="b_q" type="number" value="${v.bw.quota ? v.bw.quota / 1e9 : 0}"></div><div><label>Limit Mbps (0=∞)</label><input id="b_r" type="number" value="${v.bw.rate}"></div></div>
        <div class="row" style="margin-top:8px"><button data-a="bw" data-m="set">Set</button><button class="sec" data-a="bw" data-m="reset">Reset pemakaian</button></div></div>
      <div class="card"><h3>Port</h3>${portsTable(v)}<div class="row" style="margin-top:8px"><select id="p_proto" style="width:90px"><option>tcp</option><option>udp</option><option>both</option></select><input id="p_count" type="number" value="1" min="1" style="width:80px"><button data-a="portadd">Tambah</button></div>
        <div class="row" style="margin-top:8px"><input id="p_del" type="number" placeholder="port publik" style="width:130px"><button class="sec" data-a="portdel">Hapus port</button></div></div>
      <div class="card"><h3>Reinstall</h3><select id="rimg">${opts(IMAGES, 'ubuntu22')}</select><div style="margin-top:8px"><button class="warn" data-a="reinstall">Reinstall</button></div></div>
      <div class="card danger"><h3>Hapus VPS</h3><label>Ketik <b>${esc(v.name)}</b> untuk konfirmasi</label><input id="d_conf" autocapitalize="none"><div style="margin-top:8px"><button class="bad" data-a="delete">Hapus permanen</button></div></div>
    </div></div>`;
  document.body.appendChild(el);
  const poll = async () => {
    if (!$('#sheet')) return;
    try { $('#res').innerHTML = resHtml((await api('GET', '/api/admin/vps/' + name + '/resources')).res); } catch (e) {}
  };
  poll(); S.timers.push(setInterval(poll, 5000));
}

function closeSheet() { const e = $('#sheet'); if (e) e.remove(); S.sel = null; }

async function refreshAdmin() { if (S.tab === 'vps') await tabVps(); if (S.sel) openVps(S.sel); }

function render() {
  clearTimers(); closeSheet();
  if (S.role === 'user') return renderUser();
  if (S.role === 'admin') return renderAdmin();
  renderLogin();
}

// ---------- actions ----------
const post = (p, b) => api('POST', '/api/admin/vps/' + S.sel + p, b);
const A = {
  lm: b => { S.loginMode = b.dataset.m; renderLogin(); },
  login: b => doLogin(b),
  logout: () => logout(),
  copy: b => navigator.clipboard.writeText(b.dataset.t).then(() => toast('Disalin')).catch(() => toast('Gagal menyalin', true)),
  reveal: b => { const e = $('#pw'); const hid = e.textContent.startsWith('•'); e.textContent = hid ? e.dataset.pw : '••••••••'; b.textContent = hid ? 'Sembunyikan' : 'Tampilkan'; },
  mepower: b => act(b, async () => { const d = await api('POST', '/api/me/action', {action: b.dataset.p}); toast(b.dataset.p + ' OK'); setTimeout(renderUser, 800); }),
  mepasswd: b => act(b, async () => { const d = await api('POST', '/api/me/passwd', {password: $('#newpw').value || undefined}); toast('Password diganti'); await renderUser(); const e = $('#pw'); if (e && d.password) { e.dataset.pw = d.password; e.textContent = d.password; } }),
  mereinstall: b => act(b, async () => {
    const d = await api('POST', '/api/me/reinstall', {image: val('rimg'), confirm: val('rconf')});
    toast('Reinstall dimulai'); track(d.job, '/api/me/jobs', () => renderUser().then(() => { const l = $('#joblog'); if (l) l.style.display = 'none'; }));
  }),
  tab: b => { S.tab = b.dataset.k; renderAdmin(); },
  refresh: () => tabVps(),
  open: r => openVps(r.dataset.n),
  close: () => { closeSheet(); tabVps(); },
  power: b => act(b, async () => { await post('/action', {action: b.dataset.p}); toast(b.dataset.p + ' OK'); setTimeout(refreshAdmin, 800); }),
  resize: b => act(b, async () => { await post('/resize', {cpu: +val('z_cpu'), ram: +val('z_ram'), disk: +val('z_disk')}); toast('Resource diperbarui'); refreshAdmin(); }),
  renew: b => act(b, async () => { await post('/renew', {duration: val('x_renew')}); toast('Diperpanjang'); refreshAdmin(); }),
  expire: b => act(b, async () => { await post('/expire', {value: val('x_exp')}); toast('Expire diubah'); refreshAdmin(); }),
  passwd: b => act(b, async () => { const d = await post('/passwd', {password: val('x_pw') || undefined}); toast('Password baru: ' + d.password); refreshAdmin(); }),
  owner: b => act(b, async () => { await post('/owner', {owner: val('x_owner')}); toast('Owner disimpan'); refreshAdmin(); }),
  plan: b => act(b, async () => { await post('/plan', {plan: val('x_plan')}); toast('Tipe disimpan'); refreshAdmin(); }),
  bw: b => act(b, async () => { await post('/bandwidth', {action: b.dataset.m, quota_gb: val('b_q') || 0, rate_mbit: val('b_r') || 0}); toast('Bandwidth diperbarui'); refreshAdmin(); }),
  portadd: b => act(b, async () => { await post('/ports', {proto: val('p_proto'), count: +val('p_count')}); toast('Port ditambah'); refreshAdmin(); }),
  portdel: b => act(b, async () => { await api('DELETE', '/api/admin/vps/' + S.sel + '/ports/' + val('p_del')); toast('Port dihapus'); refreshAdmin(); }),
  reinstall: b => act(b, async () => {
    if (!confirm('Reinstall ' + S.sel + '? Semua data guest hilang.')) return;
    const d = await post('/reinstall', {image: val('rimg')}); const n = S.sel; closeSheet(); S.tab = 'vps'; renderAdmin();
    track(d.job, '/api/admin/jobs', () => tabVps());
  }),
  delete: b => act(b, async () => {
    if (val('d_conf') !== S.sel) throw new Error('Nama konfirmasi tidak cocok.');
    const d = await api('DELETE', '/api/admin/vps/' + S.sel); closeSheet(); S.tab = 'vps'; renderAdmin();
    track(d.job, '/api/admin/jobs', () => tabVps());
  }),
  create: b => act(b, async () => {
    const body = {name: val('c_name'), image: val('c_image'), cpu: +val('c_cpu'), ram: +val('c_ram'), disk: +val('c_disk'), plan: val('c_plan'), backend: val('c_backend'),
      ports: +val('c_ports'), expire: val('c_expire') || '0', owner: val('c_owner') || '-', nesting: $('#c_nest').checked,
      password: val('c_pass') || undefined, bw_quota_gb: val('c_bwq') || undefined, bw_rate_mbit: val('c_bwr') || undefined};
    const d = await api('POST', '/api/admin/vps', body);
    S.tab = 'vps'; renderAdmin(); toast('Pembuatan dimulai');
    track(d.job, '/api/admin/jobs', () => tabVps());
  }),
  sync: b => act(b, async () => { const d = await api('POST', '/api/admin/sync', {}); toast('Sync selesai'); }),
  nodes: b => act(b, async () => { const d = await api('GET', '/api/admin/nodes'); const p = $('#nodesout'); p.style.display = 'block'; p.textContent = d.output; }),
  setting: b => act(b, async () => { await api('POST', '/api/admin/settings', {key: val('s_key'), value: val('s_val')}); toast('Setting disimpan'); tabHost(); }),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el);
});

(async () => {
  try { const d = await api('GET', '/api/session'); S.role = d.role; S.name = d.name; } catch (e) {}
  render();
})();
</script>
</body>
</html>
